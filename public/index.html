<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordle Solver</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container">
    <section class="card input-card">
      <div class="input-section">
        <div class="input-row">
          <input type="text" id="guessInput" maxlength="5" placeholder="word" autocomplete="off" aria-label="Guess" />
          <div id="pickerRow" class="tiles" role="group" aria-label="Color pattern"></div>
          <select id="method" aria-label="Strategy">
            <option value="fast">Frequency</option>
            <option value="entropy">Entropy</option>
            <option value="expected">Expected steps</option>
          </select>
        </div>
        <div class="actions">
          <button id="addGuessBtn" class="btn primary">Add</button>
          <button id="updateGuessBtn" class="btn primary hidden">Update</button>
          <button id="cancelEditBtn" class="btn hidden">Cancel</button>
          <button id="undoBtn" class="btn">Undo</button>
          <button id="clearBtn" class="btn">Clear</button>
        </div>
      </div>
    </section>

    <section class="card suggestion-card">
      <h2>Next suggestion</h2>
      <div id="suggestion" class="suggestion">—</div>
      <div class="stats">
        <div class="stat">
          <span id="possibleCount" class="stat-value">—</span>
          <span class="stat-label">Possible</span>
        </div>
        <div class="stat">
          <span id="requestTime" class="stat-value">—</span>
          <span class="stat-label">Time (ms)</span>
        </div>
        <div class="stat">
          <span id="entropy" class="stat-value">—</span>
          <span class="stat-label">Entropy</span>
        </div>
      </div>
    </section>

    <section class="card analysis-card">
      <h2>Analysis</h2>
      <div id="letterFreq" class="letter-freq"></div>
      <div id="sampleWords" class="sample-words"></div>
    </section>

    <section class="card history-card">
      <h2>History</h2>
      <div id="historyContent"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
